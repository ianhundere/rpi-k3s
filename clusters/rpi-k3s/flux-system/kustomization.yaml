apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# house conventions: memory request == limit, no cpu limits (upstream ships
# 64Mi req / 1Gi lim + cpu 1000m). GOMEMLIMIT detached from limits.memory so
# go's gc runs before the cgroup killer, not at the same byte (~80% of the tier).
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all-flux-controllers
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: GOMEMLIMIT
              value: 200MiB
              valueFrom: null
            resources:
              requests:
                memory: 256Mi
              limits:
                cpu: null
                memory: 256Mi
  target:
    kind: Deployment
# source + kustomize controllers hold artifacts / full manifest builds in
# memory — bigger footprint than the rest
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sized-up
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: GOMEMLIMIT
              value: 320MiB
              valueFrom: null
            resources:
              requests:
                memory: 384Mi
              limits:
                memory: 384Mi
  target:
    kind: Deployment
    name: (source-controller|kustomize-controller)
# image-reflector is the only controller carrying a badger db (/data); stock
# badger defaults don't fit the 256Mi tier.
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: image-reflector-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: GOMEMLIMIT
              value: 448MiB
              valueFrom: null
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 512Mi
  target:
    kind: Deployment
    name: image-reflector-controller
# the repo carries a 31MB prebuilt kernel tarball (tools/rpi-kernel-48bit/out/),
# so even a shallow clone moves ~31MB. github currently delivers ~240KB/s to
# this cluster, which overruns the stock 60s clone timeout and wedges every
# deploy with "context deadline exceeded". headroom, not a cure: dropping the
# tarball from HEAD is the real fix.
- patch: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: flux-system
    spec:
      timeout: 5m0s
  target:
    kind: GitRepository
    name: flux-system
