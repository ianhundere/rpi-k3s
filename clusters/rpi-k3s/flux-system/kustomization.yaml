apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# house conventions: memory request == limit, no cpu limits (upstream ships
# 64Mi req / 1Gi lim + cpu 1000m). sized from observed usage + headroom.
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all-flux-controllers
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 256Mi
              limits:
                cpu: null
                memory: 256Mi
  target:
    kind: Deployment
# source + kustomize controllers hold artifacts / full manifest builds in
# memory — bigger footprint than the rest
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sized-up
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 384Mi
              limits:
                memory: 384Mi
  target:
    kind: Deployment
    name: (source-controller|kustomize-controller)
# image-reflector is the only controller carrying a badger db (/data); stock
# badger defaults don't fit the 256Mi tier. GOMEMLIMIT is detached from
# limits.memory so go's gc runs before the cgroup killer, not at the same byte.
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: image-reflector-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: GOMEMLIMIT
              value: 448MiB
              valueFrom: null
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 512Mi
  target:
    kind: Deployment
    name: image-reflector-controller
