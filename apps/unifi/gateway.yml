# unifi serves https on 8443 with a self-signed cert that changes per deploy,
# so an nginx sidecar (proxy_ssl_verify off) exposes plain http :8080 for the
# gateway to target instead of a BackendTLSPolicy that would need its ca.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-http-redirect
  namespace: unifi
spec:
  hostnames:
  - ${UNIFI_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: unifi-http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-https
  namespace: unifi
spec:
  hostnames:
  - ${UNIFI_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: unifi-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
        - name: X-Frame-Options
          value: "DENY"
        - name: X-Content-Type-Options
          value: "nosniff"
        - name: Referrer-Policy
          value: "strict-origin-when-cross-origin"
    backendRefs:
    - name: unifi-controller
      port: 9080
