# unifi serves https on 8443 with a self-signed cert that changes per deploy,
# so an nginx sidecar (proxy_ssl_verify off) exposes plain http :8080 for the
# gateway to target instead of a BackendTLSPolicy that would need its ca.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-http-redirect
  namespace: unifi
spec:
  hostnames:
  - ${UNIFI_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: unifi-http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-https
  namespace: unifi
spec:
  hostnames:
  - ${UNIFI_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: unifi-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
        - name: X-Frame-Options
          value: "DENY"
        - name: X-Content-Type-Options
          value: "nosniff"
        - name: Referrer-Policy
          value: "strict-origin-when-cross-origin"
    backendRefs:
    - name: unifi-controller
      port: 9080
---
# unifi.clusterian.pw is the LAN's name (the router's static-host-mapping); away from home it is unifi on the tailnet
# lan and cluster only (2026-11-26): the router forwards the WAN's 80/443 to this ingress for the public hosts,
# so without this rule a WAN client reaches the name with a Host header. it rests on envoy judging the tcp peer:
# externalTrafficPolicy Local on the envoy service, and no ClientTrafficPolicy trusting X-Forwarded-For (as
# apps/llm/policies.yml). cert-manager's http-01 challenge routes are routes of their own, so renewals still work.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: unifi-lan-only
  namespace: unifi
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unifi-https
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unifi-http-redirect
  authorization:
    defaultAction: Deny
    rules:
      - name: lan-and-cluster
        action: Allow
        principal:
          clientCIDRs:
            - 192.168.3.0/24
            - 10.42.0.0/16
