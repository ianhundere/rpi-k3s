apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app: gatus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      # no k8s API needed
      automountServiceAccountToken: false
      # scratch image with no USER directive; run as nobody
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.36.0 # {"$imagepolicy": "flux-system:gatus"}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: gatus-env
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Convention: mem limit == request (OOM protection), no CPU limit
              # (CFS throttling hurts on RPi).
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
