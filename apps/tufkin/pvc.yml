apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tufkin-postgres-pvc
  namespace: tufkin
spec:
  accessModes:
    - ReadWriteOnce
  # Migrated to csi-driver-nfs: static-bind to the tufkin-postgres-csi PV.
  storageClassName: ""
  volumeName: tufkin-postgres-csi
  resources:
    requests:
      storage: 1Gi
---
# Only the dump job mounts this, one run at a time (concurrencyPolicy Forbid).
# Static-bound to the dumps PV.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tufkin-db-dumps
  namespace: tufkin
  labels:
    app: tufkin
spec:
  storageClassName: ""
  volumeName: tufkin-db-dumps-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
