apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      securityContext:
        fsGroup: 1000
        # Skip the recursive chown of the 400Gi media-config when the root dir
        # already matches fsGroup — avoids a ~5min startup chown on every restart.
        fsGroupChangePolicy: OnRootMismatch
      enableServiceLinks: false
      containers:
        - name: calibre
          image: lscr.io/linuxserver/calibre-web:0.6.27 # {"$imagepolicy": "flux-system:calibre-web"}
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: media-config
              mountPath: /config
              subPath: calibre/config
            - name: media-config
              mountPath: /books
              subPath: calibre/library
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
          # httpGet, not tcpSocket: the socket accepts in 5ms while the app
          # needs ~1.8s to answer, so a hung calibre-web passed tcp probes
          # forever and only a human ever noticed. probe /login (49ms), never /
          # (2.7s) -- / renders the library off sqlite and probing it that often
          # starved the worker it was meant to be watching.
          startupProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
      volumes:
        - name: media-config
          persistentVolumeClaim:
            claimName: media-config
