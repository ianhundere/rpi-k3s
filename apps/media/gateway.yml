apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-tools
  namespace: media
spec:
  hostnames:
  - media.tools
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: media-tools-http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /sonarr
    backendRefs:
    - name: sonarr
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /prowlarr
    backendRefs:
    - name: prowlarr
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /radarr
    backendRefs:
    - name: radarr
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /lidarr
    backendRefs:
    - name: lidarr
      port: 80
  - matches:
    - path:
        type: Exact
        value: /qbit
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /qbit/
        statusCode: 301
  - matches:
    - path:
        type: PathPrefix
        value: /qbit/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: qbittorrent
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /soulseek
    backendRefs:
    - name: soulseek
      port: 80
  - matches:
    - path:
        type: Exact
        value: /calibre
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /calibre/
        statusCode: 301
  - matches:
    - path:
        type: PathPrefix
        value: /calibre/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Script-Name
          value: /calibre
    backendRefs:
    - name: calibre
      port: 80
---
# media.tools has no public record; away from home the media apps are on the tailnet (tailscale.com/expose)
# lan and cluster only (2026-11-26): the router forwards the WAN's 80/443 to this ingress for the public hosts,
# so without this rule a WAN client reaches the name with a Host header. it rests on envoy judging the tcp peer:
# externalTrafficPolicy Local on the envoy service, and no ClientTrafficPolicy trusting X-Forwarded-For (as
# apps/llm/policies.yml). cert-manager's http-01 challenge routes are routes of their own, so renewals still work.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: media-tools-lan-only
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: media-tools
  authorization:
    defaultAction: Deny
    rules:
      - name: lan-and-cluster
        action: Allow
        principal:
          clientCIDRs:
            - 192.168.3.0/24
            - 10.42.0.0/16
