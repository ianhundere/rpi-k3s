# prowlarr drops cf_clearance after one request, so every challenged request
# would cost a full chromium solve. this sidecar owns localhost:8191: it runs
# one solve at a time and replays a host's clearance for up to 25 minutes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flaresolverr-cache
  namespace: media
data:
  shim.py: |
    import http.server, json, threading, time, urllib.error, urllib.parse, urllib.request

    UPSTREAM = "http://127.0.0.1:8192"
    QUEUE_WAIT = 150        # seconds a request waits for the solver before a 503
    # cloudflare honours a clearance for its passage window (default 30m); the
    # cookie's own expiry (a year on 1337x) says nothing about that.
    MAX_TTL = 25 * 60
    solver = threading.Lock()
    cache, cache_lock = {}, threading.Lock()   # host -> (expires_at, cookies, user_agent)

    def log(*a):
        print(time.strftime("%H:%M:%S"), *a, flush=True)

    def lookup(host):
        with cache_lock:
            hit = cache.get(host)
            if hit and hit[0] > time.time():
                return hit
            cache.pop(host, None)

    def remember(host, solution):
        cookies = solution.get("cookies") or []
        cf = next((c for c in cookies if c.get("name") == "cf_clearance"), None)
        if not cf:
            return
        with cache_lock:
            cache[host] = (time.time() + MAX_TTL, cookies, solution.get("userAgent"))
        log("cached", host)

    def replay(url, hit):
        now = int(time.time() * 1000)
        return {"status": "ok", "message": "Challenge solved! (cached clearance)",
                "solution": {"url": url, "status": 200, "headers": {}, "response": "",
                             "cookies": hit[1], "userAgent": hit[2]},
                "startTimestamp": now, "endTimestamp": now, "version": "cache"}

    def upstream(body, timeout):
        req = urllib.request.Request(UPSTREAM + "/v1", data=body, headers={"Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()

    class Handler(http.server.BaseHTTPRequestHandler):
        def reply(self, code, payload):
            data = payload if isinstance(payload, bytes) else json.dumps(payload).encode()
            try:
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            except (BrokenPipeError, ConnectionResetError):
                pass  # prowlarr gave up; the solve still finished and was cached

        def do_GET(self):
            try:
                with urllib.request.urlopen(UPSTREAM + self.path, timeout=10) as r:
                    self.reply(r.status, r.read())
            except Exception as e:
                self.reply(502, {"status": "error", "message": str(e)})

        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            req = json.loads(body or b"{}")
            url = req.get("url") or ""
            host = urllib.parse.urlsplit(url).hostname
            cacheable = req.get("cmd") in ("request.get", "request.post") and host and not req.get("session")
            start = time.time()
            if cacheable:
                hit = lookup(host)
                if hit:
                    log("hit", host)
                    return self.reply(200, replay(url, hit))
            # wait for the solver, but take a clearance another request just earned
            while not solver.acquire(timeout=2):
                hit = cacheable and lookup(host)
                if hit:
                    log("hit after wait", host, f"{time.time() - start:.0f}s")
                    return self.reply(200, replay(url, hit))
                if time.time() - start > QUEUE_WAIT:
                    log("queue timeout", host)
                    return self.reply(503, {"status": "error", "message": "solver busy"})
            try:
                hit = cacheable and lookup(host)
                if hit:
                    log("hit after wait", host, f"{time.time() - start:.0f}s")
                    return self.reply(200, replay(url, hit))
                waited = time.time() - start
                code, data = upstream(body, (req.get("maxTimeout") or 60000) / 1000 + 30)
                if cacheable and code == 200:
                    remember(host, json.loads(data).get("solution") or {})
                log("solve", host, code, f"wait={waited:.0f}s", f"solve={time.time() - start - waited:.0f}s")
                self.reply(code, data)
            finally:
                solver.release()

        def log_message(self, *a):
            pass

    server = http.server.ThreadingHTTPServer(("127.0.0.1", 8191), Handler)
    server.daemon_threads = True
    log("serving 127.0.0.1:8191 ->", UPSTREAM)
    server.serve_forever()
