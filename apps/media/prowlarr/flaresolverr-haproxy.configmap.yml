# one solve at a time: each runs its own chromium (0.5-1Gi), so concurrent ones
# pass flaresolverr's memory limit. no abortonclose: flaresolverr keeps solving
# after a client gives up, so the slot must stay held until it answers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flaresolverr-haproxy
  namespace: media
data:
  haproxy.cfg: |
    global
      maxconn 64
      log stdout format raw local0

    defaults
      mode http
      log global
      option httplog
      timeout connect 5s
      timeout client 330s
      timeout server 330s
      timeout queue 150s

    frontend flaresolverr
      bind 127.0.0.1:8191
      default_backend solver

    backend solver
      server flaresolverr 127.0.0.1:8192 maxconn 1
