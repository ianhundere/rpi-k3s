---
# metrics-server only reports the instantaneous value, and nothing in this
# cluster retains it -- so requests get set from a cold-start reading and the
# fleet ends up 88% requested at 35% used. This samples per-container memory
# to a file so peaks exist to right-size against.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: capacity-recorder
  namespace: capacity-recorder
spec:
  # 5m: dense enough to catch working-set creep, which is the failure mode this
  # fleet has actually seen. A briefer excursion between samples is invisible
  # here -- accepted limitation of sampling rather than scraping.
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: capacity-recorder
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: capacity-recorder
              image: alpine/kubectl:1.34.1
              env:
                # kubectl caches discovery under HOME; root fs is read-only
                - name: HOME
                  value: /tmp
              command: ['/bin/sh', '-c']
              args:
                # $$ escapes are load-bearing -- flux substitutes bare ${...}
                # from cluster-vars, and awk's $1..$5 would be eaten too.
                - |
                  set -eu
                  TS="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  F="/data/$$(date -u +%Y-%m-%d).tsv"
                  # ts, namespace, pod, container, cpu, memory -- one row per
                  # container, because requests are set per container.
                  kubectl top pods -A --containers --no-headers \
                    | awk -v ts="$${TS}" '{print ts"\t"$$1"\t"$$2"\t"$$3"\t"$$4"\t"$$5}' \
                    >> "$${F}"
                  echo "appended $$(wc -l < "$${F}") total rows to $${F}"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: capacity-recorder
            - name: tmp
              emptyDir: {}
