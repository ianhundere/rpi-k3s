# llm.clusterian.pw: HTTP-only LAN name like monitor.clusterian.pw (no public record; the ER-X static-host-mapping
# points it at the ingress). Its listener, llm-http, is in infrastructure/envoy-gateway/gateway.yml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: llm
spec:
  hostnames:
  - llm.clusterian.pw
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: llm-http
  rules:
  - backendRefs:
    - name: llm
      port: 80
