apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: llm
  labels:
    app: llm
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      # stock python image, the program from the configmap (the Box's repository has no image registry)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: front-door
          image: python:3.13.15-alpine3.24
          command: ["python", "/app/front_door.py"]
          ports:
            - containerPort: 8080
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: SRD_BOX, value: llm-box.llm.svc.cluster.local }
            - { name: SRD_STATE_FILE, value: /data/state.json }
            - { name: TZ, value: America/Los_Angeles }
          envFrom:
            - secretRef:
                name: llm-env
          volumeMounts:
            - { name: program, mountPath: /app, readOnly: true }
            - { name: state, mountPath: /data }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 64Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet: { path: /_srd/state, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /_srd/state, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: program
          configMap:
            name: llm
        - name: state
          persistentVolumeClaim:
            claimName: llm-state
