apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser-http-redirect
  namespace: filebrowser
spec:
  hostnames:
  - ${FILEBROWSER_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: filebrowser-http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser-https
  namespace: filebrowser
spec:
  hostnames:
  - ${FILEBROWSER_HOST}
  parentRefs:
  - name: shared-gateway
    namespace: envoy-gateway-system
    sectionName: filebrowser-https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
        - name: X-Frame-Options
          value: "DENY"
        - name: X-Content-Type-Options
          value: "nosniff"
        - name: Referrer-Policy
          value: "strict-origin-when-cross-origin"
    backendRefs:
    - name: filebrowser
      port: 44301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: filebrowser-client-traffic
  namespace: envoy-gateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-gateway
    sectionName: filebrowser-https
  timeout:
    http:
      requestReceivedTimeout: 60s
---
# share.clusterian.pw is the LAN's name (the router's static-host-mapping); away from home it is share on the tailnet
# lan and cluster only (2026-11-26): the router forwards the WAN's 80/443 to this ingress for the public hosts,
# so without this rule a WAN client reaches the name with a Host header. it rests on envoy judging the tcp peer:
# externalTrafficPolicy Local on the envoy service, and no ClientTrafficPolicy trusting X-Forwarded-For (as
# apps/llm/policies.yml). cert-manager's http-01 challenge routes are routes of their own, so renewals still work.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: filebrowser-lan-only
  namespace: filebrowser
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: filebrowser-https
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: filebrowser-http-redirect
  authorization:
    defaultAction: Deny
    rules:
      - name: lan-and-cluster
        action: Allow
        principal:
          clientCIDRs:
            - 192.168.3.0/24
            - 10.42.0.0/16
