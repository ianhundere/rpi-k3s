apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - secret.yml
  - deployment.yml
  - service.yml
  - gateway.yml
  - policies.yml
configMapGenerator:
  - name: searxng-config
    namespace: searxng
    files:
      - settings.yml
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
