# search.clusterian.pw: HTTP-only LAN name (no public DNS; ER-X static-host-mapping -> 192.168.3.240).
# Listener search-http lives in rpi-k3s infrastructure/envoy-gateway/gateway.yml (namespace searxng only).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: searxng
spec:
  hostnames:
    - search.clusterian.pw
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
      sectionName: search-http
  rules:
    - backendRefs:
        - name: searxng
          port: 80
