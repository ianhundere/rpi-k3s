# LAN-only self-hosted SearXNG for Open WebUI (http://llm.clusterian.pw) and Pi web_search.
# Formats include json so Open WebUI and Pi can query /search?q=<query>&format=json directly.
# server.secret_key is supplied via SEARXNG_SECRET env var from Secret searxng-env.
use_default_settings: true

general:
  instance_name: "household search"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
