apiVersion: v1
kind: Service
metadata:
  name: ha
  namespace: ha
spec:
  # HA runs hostNetwork on the master; this ClusterIP is for in-cluster
  # consumers only. LAN access is the node IP :8123 directly.
  type: ClusterIP
  selector:
    app: ha
  ports:
    - name: ha
      protocol: TCP
      port: 8123
      targetPort: 8123
