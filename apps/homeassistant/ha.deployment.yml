apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha
  namespace: ha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ha
  template:
    metadata:
      labels:
        app: ha
    spec:
      # hostNetwork so mDNS discovery (Voice PE / ESPHome) works on the LAN;
      # HA serves directly at the master node IP :8123
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: ha
          image: ghcr.io/home-assistant/home-assistant:2026.6.4
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          env:
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: ha
              mountPath: /config
      volumes:
        - name: ha
          persistentVolumeClaim:
            claimName: ha
