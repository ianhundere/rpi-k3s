# LAN-only: ha.media.tools resolves via edgey static-host-mapping -> gateway;
# no public DNS record exists for it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha
  namespace: ha
spec:
  hostnames:
    - ha.media.tools
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
      sectionName: ha-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ha
          port: 8123
