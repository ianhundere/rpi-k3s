# Local voice pipeline (v1): Wyoming STT + TTS on the amd64 master.
# HA (hostNetwork) reaches these via ClusterIP through the node's kube-proxy.
# Future: GPU faster-whisper on the gaming PC as primary, these become fallback
# (see _bmad-output/implementation-artifacts/spec-ha-voice-pipeline.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-whisper
  namespace: ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-whisper
  template:
    metadata:
      labels:
        app: wyoming-whisper
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: whisper
          image: rhasspy/wyoming-whisper:3.5.0
          # base-int8 fits the master's memory budget; the GPU whisper on the
          # gaming PC (spec phase 2) is the quality path — this is the fallback
          args: ["--model", "base-int8", "--language", "en"]
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 10300
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-whisper
  namespace: ha
spec:
  selector:
    app: wyoming-whisper
  ports:
    - port: 10300
      targetPort: 10300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-piper
  namespace: ha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-piper
  template:
    metadata:
      labels:
        app: wyoming-piper
    spec:
      # piper is light — run on the Pis, keep amd64 headroom for HA + whisper
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: piper
          image: rhasspy/wyoming-piper:2.3.1
          args: ["--voice", "en_US-lessac-medium"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 10200
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-piper
  namespace: ha
spec:
  selector:
    app: wyoming-piper
  ports:
    - port: 10200
      targetPort: 10200
