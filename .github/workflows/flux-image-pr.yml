name: Create Image Update PR
# Flux stacks commits on the existing flux-image-updates branch, so the branch
# outlives its PR. Order matters: an emptied branch (bumps landed by hand) and a
# conflicting one both get deleted (contents: write); Flux re-derives bumps in <15m.
on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
concurrency:
  group: flux-image-pr
  cancel-in-progress: true
jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check for pending image updates
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git fetch origin flux-image-updates 2>/dev/null; then
            echo "::notice::flux-image-updates branch does not exist — nothing pending"
            exit 0
          fi
          # net diff first, PR state second: a PR whose bumps were landed on main
          # by hand still reports MERGEABLE, so checking the PR first leaves an
          # empty PR open forever. Deleting the branch closes it.
          if git diff --quiet origin/main origin/flux-image-updates; then
            echo "::notice::flux-image-updates has no net diff vs main — deleting the leftover branch (closes any open PR)"
            git push origin --delete flux-image-updates
            exit 0
          fi
          existing_pr=$(gh pr list --head flux-image-updates --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            mergeable=$(gh pr view "$existing_pr" --json mergeable --jq .mergeable)
            case "$mergeable" in
              CONFLICTING)
                echo "::notice::PR #$existing_pr conflicts with main — deleting flux-image-updates (closes the PR); Flux re-pushes fresh bumps within 15m"
                git push origin --delete flux-image-updates ;;
              MERGEABLE)
                echo "::notice::PR #$existing_pr open and mergeable — Flux pushes update it automatically" ;;
              *)
                echo "::notice::PR #$existing_pr mergeability is '$mergeable' — checking again next run" ;;
            esac
            exit 0
          fi
          # no ancestry check: a branch merely BEHIND main still merges, and one
          # that genuinely cannot shows up as CONFLICTING on the next run.
          echo "pending=true" >> "$GITHUB_OUTPUT"
          git log origin/main..origin/flux-image-updates --pretty='- %s' > /tmp/pending-commits.md
      - name: Create PR
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create image-update --description "Automated image updates" --color "0E8A16" --force
          {
            echo "Automated image version bumps by Flux image-automation-controller."
            echo
            echo "### Pending updates"
            cat /tmp/pending-commits.md
          } > /tmp/pr-body.md
          gh pr create \
            --title "chore(images): automated image updates" \
            --body-file /tmp/pr-body.md \
            --label "image-update" \
            --head flux-image-updates \
            --base main
