---
# Bounds the operator-created ts-* proxy pods, which the chart cannot size
# itself (no proxyConfig.resources — setting it is silently ignored).
# Wired in as proxyConfig.defaultProxyClass in release.yml so it applies to
# every Service-backed proxy without annotating each app's Service.
#
# 128Mi mem req==lim, no cpu limits, per repo convention. Proxies idle at
# ~53-63Mi each; 8 of them (prowlarr on bounded-192 below), ~1.1Gi fleet-wide.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: bounded
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 128Mi
---
# ts-prowlarr runs at ~105Mi of 128Mi (84%); one bigger class for it alone,
# picked by the `tailscale.com/proxy-class` label on the prowlarr Service.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: bounded-192
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            memory: 192Mi
