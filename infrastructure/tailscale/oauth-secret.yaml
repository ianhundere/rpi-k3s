---
# The operator's tailnet credentials, mounted at /oauth/client_{id,secret}.
#
# Deliberately NOT rendered from the chart's .Values.oauth: doing that puts the
# client secret in plaintext inside the HelmRelease object, readable with
# `kubectl get helmrelease -n tailscale -o yaml`. Values come from
# config/cluster-secrets.enc.yaml via Flux postBuild substitution, so the
# credential only ever materialises inside a Secret.
#
# Rotating: update TS_CLIENT_ID / TS_CLIENT_SECRET in cluster-secrets.enc.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
type: Opaque
stringData:
  client_id: ${TS_CLIENT_ID}
  client_secret: ${TS_CLIENT_SECRET}
