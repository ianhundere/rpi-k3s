---
# replacement for the deprecated nfs-subdir provisioner; kube-system because
# the node DaemonSet needs privileged hostPath. sidecars sized req==lim at
# ~1.2x observed peak; snapshotter off — no VolumeSnapshot CRDs on this cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1
      runOnControlPlane: false
      enableSnapshotter: false
      resources:
        csiProvisioner:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 80Mi
        csiResizer:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 80Mi
        livenessProbe:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
        nfs:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 64Mi
    node:
      resources:
        livenessProbe:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
        nfs:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 64Mi
        nodeDriverRegistrar:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
    externalSnapshotter:
      enabled: false
