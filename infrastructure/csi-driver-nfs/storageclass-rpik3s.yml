---
# future dynamic PVCs under /volume3/rpi-k3s only; live data rides static csi
# PVs. rsize/wsize 1M negotiates down to the synology max (128K). ${NFS_IP} is
# flux-substituted; the $${...} csi tokens must stay literal.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-rpik3s
provisioner: nfs.csi.k8s.io
parameters:
  server: "${NFS_IP}"
  share: /volume3/rpi-k3s
  subDir: "$${pvc.metadata.namespace}/$${pvc.metadata.name}"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
  - timeo=600
  - retrans=3
  - proto=tcp
  - rsize=1048576
  - wsize=1048576
  - noatime
  - nodiratime
