---
# envoy gateway chart as an oci artifact (no HelmRepository index to poll).
# bump the tag here; release.yml runs crds CreateReplace so the bundled
# gateway-api + eg crds move with it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.8.0
