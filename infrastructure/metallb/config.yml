---
# pool + l2 advertisement only. metallb itself (v0.14.8) was kubectl-applied
# in 2023-04 and is not flux-managed yet. envoy's LB ip and unifi's externalIPs
# are both pinned to the first address (METAL_LB_IP1).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - ${METAL_LB_IP1}-${METAL_LB_IP11}
  autoAssign: true
  avoidBuggyIPs: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2advertisement1
  namespace: metallb-system
spec:
  ipAddressPools:
    - default
