---
# Weekly rotation of the Envoy data-plane pod. Belt-and-suspenders for the
# TCMalloc-under-cgroup-pressure failure mode that took down quixit.us +
# auth.quixit.us on 2026-05-14 after 33 days of pod uptime.
#
# Why this exists even though we raised the memory limit and bumped Envoy
# Gateway: the underlying failure mode is unbounded allocator drift over time.
# 4× memory headroom + v1.8.0's deferred stat creation push the natural
# failure interval out to many months, but never to zero. A scheduled weekly
# pod recycle resets allocator state before the ceiling can be approached.
#
# Design choices, each load-bearing:
#
# 1. `kubectl delete pod` (not `rollout restart`) — Flux ignores pod-level
#    operations. The 2026-05-14 cascade was caused by `rollout restart`
#    adding a `kubectl.kubernetes.io/restartedAt` annotation, which Flux
#    reverted on next reconcile, triggering wave-2 restarts of everything.
#    Pod deletion is invisible to Flux.
#
# 2. Sunday 10:00 UTC = 03:00 PDT — verified dead window for quixit's user
#    base (US-centric, small community). The 5-min scheduler ticker is
#    24/7 but absorbs a 5-10s API blip without issue (next tick picks up).
#    Cycle phase transitions are admin-set times; nothing fires at 3am Sun.
#
# 3. Label selector `app.kubernetes.io/component=proxy` — matches only the
#    data-plane pod, not the control-plane `envoy-gateway` controller.
#    Control plane has its own much-slower drift pattern and is left alone.
#    **WARNING for future maintainers:** the selector deletes ALL matching
#    pods. Safe today because the data plane runs `replicas: 1`. If that
#    ever becomes 2+ (true HA), this rewrites to a full outage instead of
#    a rolling restart. Switch to "delete the oldest pod only" via e.g.
#    `kubectl get pods ... --sort-by=.metadata.creationTimestamp -o name | head -1`
#    when replicas grows. Also stagger the rotation across pods (e.g. odd
#    weeks rotate pod-0, even weeks pod-1) to preserve HA during the recycle.
#
# 4. RBAC scoped to `envoy-gateway-system` namespace, pods resource only.
#    No cluster-wide permissions. Cannot affect any other workload.
#
# 5. The job VERIFIES the replacement comes back Ready and fails loudly if it
#    doesn't (#52). Before this, rotation was fire-and-forget: on 2026-07-05 it
#    deleted the pod, the replacement crashlooped 121× over ~10h, and nothing
#    noticed until a human did. A failed Job now surfaces it the same day.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-data-plane-rotator
  namespace: envoy-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envoy-data-plane-rotator
  namespace: envoy-gateway-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # watch is needed by `delete` (blocking) and `wait`; still namespace- and
    # pods-scoped, so the blast radius is unchanged.
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envoy-data-plane-rotator
  namespace: envoy-gateway-system
subjects:
  - kind: ServiceAccount
    name: envoy-data-plane-rotator
    namespace: envoy-gateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envoy-data-plane-rotator
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: envoy-data-plane-rotate
  namespace: envoy-gateway-system
spec:
  # Sunday 10:00 UTC = Sunday 03:00 PDT (US off-peak for quixit's user base)
  schedule: "0 10 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # backoffLimit 0, NOT 1: the job now has a side effect (the delete)
      # followed by verification. A retry would delete the replacement while
      # it is still trying to come up — turning a slow start into an outage.
      # One attempt, then fail visibly.
      backoffLimit: 0
      # bounds the whole rotation: delete + create-wait + ready-wait
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: envoy-data-plane-rotator
          restartPolicy: Never
          # rancher/kubectl is a slim image without `sh` — no shell loops are
          # possible here, so each step is a separate kubectl invocation and
          # the initContainer sequence provides the ordering.
          initContainers:
            # blocking delete (no --wait=false): returns only once the old pod
            # is actually gone, so the readiness check below can't match it
            - name: rotate
              image: rancher/kubectl:v1.35.1
              command: ["kubectl"]
              args:
                - delete
                - pod
                - --namespace=envoy-gateway-system
                - --selector=app.kubernetes.io/component=proxy
                - --grace-period=30
                # no-op (exit 0) when nothing matches — defensive against
                # rotating while the data plane is already mid-restart
                - --ignore-not-found=true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 64Mi
            # the Deployment controller needs a moment to create the
            # replacement; without this the readiness wait below can race it
            # and exit "no matching resources found"
            - name: await-create
              image: rancher/kubectl:v1.35.1
              command: ["kubectl"]
              args:
                - wait
                - --for=create
                - pod
                - --namespace=envoy-gateway-system
                - --selector=app.kubernetes.io/component=proxy
                - --timeout=120s
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 64Mi
          containers:
            # the actual point of #52: a sick replacement fails the Job today
            # instead of running degraded until someone notices next week
            - name: await-ready
              image: rancher/kubectl:v1.35.1
              command: ["kubectl"]
              args:
                - wait
                - --for=condition=Ready
                - pod
                - --namespace=envoy-gateway-system
                - --selector=app.kubernetes.io/component=proxy
                - --timeout=300s
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 64Mi
