---
# data-plane pod config for the eg GatewayClass. no arch pin since 2026-07-05:
# all four pis run the 48-bit-VA kernels envoy's tcmalloc needs (exit 133 on
# stock 39-bit) — see tools/rpi-kernel-48bit; nodeSelector amd64 is the stopgap.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-config
  namespace: envoy-gateway-system
spec:
  # mergeGateways keeps one envoy deployment / one metallb ip even if a second
  # Gateway is ever added; today shared-gateway is the only one.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            # deliberate req!=lim exemption: 1Gi is the tcmalloc-drift ceiling
            # paired with the weekly recycle in cronjob-rotate.yml (2026-05-14).
            limits:
              memory: "1Gi"
        # the shutdown-manager sidecar ships with no limit and sits at ~97Mi;
        # bound it like everything else (req==lim, no cpu limit).
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 10m
                          memory: 128Mi
                        limits:
                          memory: 128Mi
      envoyService:
        externalTrafficPolicy: Local
        # In merged-gateway mode, the per-Gateway `metallb` annotation on
        # shared-gateway metadata is ignored — EG creates a single Envoy
        # Service based on this EnvoyProxy spec, so the IP must be pinned
        # here to keep reusing METAL_LB_IP1 (no local DNS changes).
        annotations:
          metallb.universe.tf/loadBalancerIPs: ${METAL_LB_IP1}
