---
# rewrites every `$imagepolicy` marker under ./apps and pushes the result to
# flux-image-updates every 15m; .github/workflows/flux-image-pr.yml makes the
# daily PR. flux stacks commits on that branch, so it is deleted after merge.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-image-updates
  namespace: flux-system
spec:
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |-
        chore(images): update container images

        {{- range .Changed.Changes}}
        - {{.OldValue}} -> {{.NewValue}}
        {{- end}}

        [skip ci]
    push:
      branch: flux-image-updates
  update:
    path: ./apps
