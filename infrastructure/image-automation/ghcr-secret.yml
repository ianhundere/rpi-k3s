---
# ghcr pull creds for the quixit/tufkin ImageRepository scans (secretRef in
# imagerepositories.yml). was hand-applied 2026-03 and lived only on the
# cluster; templated here so a rebuild does not silently lose scanning.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: flux-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"ianhundere","password":"${GHCR_TOKEN}"}}}'
