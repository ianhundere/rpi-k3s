---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.19.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    config:
      enableGatewayAPI: true
    # all three pods previously ran unbounded — on a memory-saturated fleet that
    # makes cert renewal a possible OOM casualty. mem req==lim, no cpu limits;
    # ~2-3x observed steady state (controller 42Mi, cainjector 36Mi, webhook 63Mi).
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
    startupapicheck:
      timeout: 5m
    crds:
      enabled: true
    webhook:
      hostNetwork: true
      securePort: 10260
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 128Mi
