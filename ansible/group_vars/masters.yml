---
# master k3s server flags: a first-boot approximation for DR. the record is
# k3s-config/k3s_server-config.yml (copy it to /etc/rancher/k3s/config.yaml on
# the node, fill node-ip / tls-san); keep these in sync with it.
k3s_server_args:
  - "--disable servicelb"
  - "--disable traefik"
  - "--cluster-init"
  - "--tls-san {{ ansible_host }}"
