---
# OS-level preparation for k3s: hostname, timezone, cgroups, base packages.
# Idempotent and --limit-safe. Reboots a node only if its cgroup config changed.
- name: Prepare all nodes for k3s
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # Off by default. A full dist-upgrade can pull a stock kernel that reverts
    # the recompiled 48-bit-VA kernel (Envoy Gateway fix) or overwrite the
    # cgroup-enabled cmdline.txt — destabilizing on a re-run against the live
    # cluster. Opt in for a fresh DR bootstrap with `-e full_upgrade=true`.
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      when: full_upgrade | default(false) | bool

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Map 127.0.1.1 to hostname in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Read current timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: current_tz
      changed_when: false
      check_mode: false

    - name: Set timezone
      ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
      when: current_tz.stdout != timezone

    # --- cgroups (Raspberry Pi only) -----------------------------------
    # k3s needs the memory cgroup enabled, which on Pi OS means appending
    # kernel params to the single-line cmdline.txt BEFORE k3s is installed.
    # Newer Pi OS uses /boot/firmware/cmdline.txt; older uses /boot/cmdline.txt.
    # Non-Pi nodes (amd64) have neither file and enable cgroups by default —
    # they fall through every cgroup task via `when: cmdline_file | length > 0`.
    - name: Locate Pi cmdline.txt
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/cmdline.txt
        - /boot/cmdline.txt
      register: cmdline_stat

    - name: Resolve active cmdline.txt path
      ansible.builtin.set_fact:
        cmdline_file: >-
          {{ (cmdline_stat.results
              | selectattr('stat.exists')
              | map(attribute='stat.path')
              | list
              | first) | default('') }}

    - name: Enable memory cgroups in cmdline.txt
      # cmdline.txt is a single kernel-param line. Anchor on the whole line
      # rather than 'rootwait' (omitted by some Ubuntu/DietPi Pi images) so the
      # params are always appended; the negative lookahead keeps it idempotent.
      ansible.builtin.replace:
        path: "{{ cmdline_file }}"
        regexp: '^(?!.*cgroup_memory=1)(?!.*cgroup_enable=cpuset)(.+)$'
        replace: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
      when: cmdline_file | length > 0
      register: cgroup_config

    # --- packages ------------------------------------------------------
    - name: Install required base packages
      ansible.builtin.apt:
        name:
          - nfs-common
          - open-iscsi
          - curl
          - git
          - screen
        state: present

    - name: Install apparmor on x86_64 nodes
      ansible.builtin.apt:
        name:
          - apparmor
          - apparmor-utils
        state: present
      when: ansible_architecture == "x86_64" or (install_apparmor | default(false) | bool)

    # Keep x86_64 thermal management (Intel DPTF/RAPL) active on the Beelink
    # mini-PC while skipping ARM Pi workers cleanly.
    - name: Install thermald on x86_64 nodes
      ansible.builtin.apt:
        name: thermald
        state: present
      when: ansible_facts['architecture'] == "x86_64" or (install_thermald | default(false) | bool)
      register: thermald_pkg

    - name: Enable and start thermald
      ansible.builtin.systemd_service:
        name: thermald
        enabled: true
        state: started
      when: >-
        (ansible_facts['architecture'] == "x86_64"
         or (install_thermald | default(false) | bool))
        and not (ansible_check_mode and thermald_pkg is changed)

    # Tracing tools for the ~/projects/reading study builds (bpftrace one-liners,
    # bpftool for BTF dumps, clang for bpf2go, tcpdump as the capture reference).
    # Workers only. Under the kube-master fallback (see
    # ~/projects/reading/00-foundation/lab.md), widen the when to include it.
    - name: Install tracing tools on workers
      ansible.builtin.apt:
        name:
          - bpftrace
          - bpftool
          - clang
          - tcpdump
        state: present
      when: inventory_hostname in groups['workers']

    # --- DietPi backup filter (k3s exclusions) -------------------------
    - name: Check for DietPi
      ansible.builtin.stat:
        path: /boot/dietpi
      register: dietpi_dir

    - name: Deploy dietpi-backup filter with k3s exclusions
      # Without the kubelet exclusion, dietpi-backup rsyncs NFS bind mounts
      # under volume-subpaths/ — i.e. the whole media library.
      ansible.builtin.copy:
        dest: /boot/dietpi/.dietpi-backup_inc_exc
        mode: "0644"
        content: |
          # DietPi-Backup include/exclude filter (defaults + k3s exclusions)
          + /mnt/dietpi_userdata/
          - /mnt/*
          - /media/
          # k3s: containerd state (NB includes local-path PV dir k3s/storage/)
          - /var/lib/rancher/
          # k3s: ephemeral pod state incl. NFS bind mounts (2.3TB media library)
          - /var/lib/kubelet/
      when: dietpi_dir.stat.exists

    # --- DietPi CPU governor & frequency limits ------------------------
    # Codify /boot/dietpi.txt CPU settings and apply via dietpi-set_cpu so
    # intel_pstate HWP uses powersave/balance_performance instead of pinning
    # high clocks/heat. Pre-edit slurp avoids /boot/dietpi.txt.*~ clutter.
    - name: Configure DietPi CPU governor and frequency limits
      when: dietpi_dir.stat.exists and dietpi_cpu_governor is defined
      block:
        - name: Read /boot/dietpi.txt before edits for rollback
          ansible.builtin.slurp:
            src: /boot/dietpi.txt
          register: dietpi_txt_backup

        - name: Find cpufreq policy governor files before applying
          ansible.builtin.find:
            paths: /sys/devices/system/cpu/cpufreq
            patterns: scaling_governor
            file_type: file
            recurse: true
            depth: 2
          register: cpufreq_gov_files_before

        - name: Read current cpufreq policy governors
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          loop: >-
            {{ cpufreq_gov_files_before.files
               | selectattr('path', 'match', '.*/policy[0-9]+/scaling_governor$')
               | sort(attribute='path') }}
          loop_control:
            label: "{{ item.path }}"
          register: cpufreq_gov_before

        - name: Configure DietPi CPU settings in /boot/dietpi.txt
          ansible.builtin.lineinfile:
            path: /boot/dietpi.txt
            regexp: "^[ \\t]*{{ item.key }}="
            line: "{{ item.key }}={{ item.value }}"
            firstmatch: true
          loop:
            - { key: "CONFIG_CPU_GOVERNOR", value: "{{ dietpi_cpu_governor }}" }
            - { key: "CONFIG_CPU_MAX_FREQ", value: "{{ dietpi_cpu_max_freq }}" }
            - { key: "CONFIG_CPU_MIN_FREQ", value: "{{ dietpi_cpu_min_freq }}" }
            - { key: "CONFIG_CPU_DISABLE_TURBO", value: "{{ dietpi_cpu_disable_turbo }}" }
          register: dietpi_txt_config

        - name: Apply DietPi CPU governor settings
          ansible.builtin.command: /boot/dietpi/func/dietpi-set_cpu
          when: >-
            dietpi_txt_config is changed
            or (cpufreq_gov_before.results | length) == 0
            or (cpufreq_gov_before.results
                | map(attribute='content')
                | map('b64decode')
                | map('trim')
                | reject('equalto', dietpi_cpu_governor)
                | list | length) > 0
          changed_when: true

        - name: Find cpufreq policy governor files after applying
          ansible.builtin.find:
            paths: /sys/devices/system/cpu/cpufreq
            patterns: scaling_governor
            file_type: file
            recurse: true
            depth: 2
          register: cpufreq_gov_files_after
          when: not ansible_check_mode

        - name: Read cpufreq policy governors after applying
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          loop: >-
            {{ cpufreq_gov_files_after.files
               | selectattr('path', 'match', '.*/policy[0-9]+/scaling_governor$')
               | sort(attribute='path') }}
          loop_control:
            label: "{{ item.path }}"
          register: cpufreq_gov_after
          when: not ansible_check_mode

        - name: Verify all cpufreq policies match target governor
          ansible.builtin.assert:
            that:
              - (cpufreq_gov_after.results | length) > 0
              - >-
                (cpufreq_gov_after.results
                 | map(attribute='content')
                 | map('b64decode')
                 | map('trim')
                 | reject('equalto', dietpi_cpu_governor)
                 | list | length) == 0
            fail_msg: >-
              Expected all cpufreq policy*/scaling_governor values to be
              '{{ dietpi_cpu_governor }}', got:
              {{ cpufreq_gov_after.results
                 | map(attribute='item.path')
                 | zip(cpufreq_gov_after.results
                       | map(attribute='content')
                       | map('b64decode')
                       | map('trim'))
                 | map('join', '=')
                 | list }}
          when: not ansible_check_mode
      rescue:
        - name: Restore /boot/dietpi.txt from pre-edit backup
          ansible.builtin.copy:
            content: "{{ dietpi_txt_backup.content | b64decode }}"
            dest: /boot/dietpi.txt
            mode: "0644"
          when:
            - dietpi_txt_backup is defined
            - dietpi_txt_backup.content is defined
            - dietpi_txt_config is defined
            - dietpi_txt_config is changed

        - name: Re-apply restored DietPi CPU settings best-effort
          ansible.builtin.command: /boot/dietpi/func/dietpi-set_cpu
          when:
            - dietpi_txt_backup is defined
            - dietpi_txt_backup.content is defined
            - dietpi_txt_config is defined
            - dietpi_txt_config is changed
          failed_when: false

        - name: Fail after DietPi CPU rollback
          ansible.builtin.fail:
            msg: >-
              {{ ansible_failed_task.name | default('DietPi CPU configuration') }}
              failed: {{ ansible_failed_result.msg
                         | default(ansible_failed_result.stderr
                                   | default('see task output above')) }}

    # --- optional PoE HAT fan ------------------------------------------
    - name: Locate Pi config.txt
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/config.txt
        - /boot/config.txt
      register: config_stat
      when: enable_poe_fan | bool

    - name: Resolve active config.txt path
      ansible.builtin.set_fact:
        config_file: >-
          {{ (config_stat.results
              | selectattr('stat.exists')
              | map(attribute='stat.path')
              | list
              | first) | default('') }}
      when: enable_poe_fan | bool

    - name: Configure PoE HAT fan
      # Guarded on a real config.txt: a node without one (e.g. the amd64 worker)
      # is silently skipped instead of failing on a non-existent path.
      ansible.builtin.lineinfile:
        path: "{{ config_file }}"
        line: "dtoverlay=i2c-fan,emc2301"
        create: false
      when: enable_poe_fan | bool and config_file | default('') | length > 0

    # --- reboot only if cgroups changed --------------------------------
    - name: Reboot if cgroup config changed
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: cgroup_config is defined and cgroup_config.changed
